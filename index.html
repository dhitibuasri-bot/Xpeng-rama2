<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-tech Rama 2 Service Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(to bottom, #0B0F19, #111827);
            color:#E2E8F0;
            font-family: 'Prompt', sans-serif;
        }
        .glass{
            background: rgba(26,32,44,0.75);
            backdrop-filter: blur(12px);
            border: 1px solid #2D3748;
            border-radius: 24px;
        }
        .btn-green{
            background: #7EF29A;
            color: #0B0F19;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(126, 242, 154, 0.25);
        }
        .btn-green:hover{
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(126, 242, 154, 0.4);
        }
    </style>
</head>

<body class="min-h-screen py-12">

    <div class="max-w-5xl mx-auto px-6">

        <!-- HEADER -->
        <header class="text-center mb-12">
            <!-- 🟢 ปรับพื้นหลังกล่องโลโก้ให้เข้ากับธีมมืด และใส่ฟิลเตอร์เงาเรืองแสงสีเขียวให้กับตัวภาพโลโก้โดยตรง -->
            <div class="bg-slate-950/60 rounded-[32px] px-20 py-10 inline-block shadow-lg mb-5 border border-slate-800 backdrop-blur-sm">
                <img src="static/logo.png" class="w-[320px] mx-auto" alt="XPENG Logo" style="filter: drop-shadow(0 0 15px rgba(126, 242, 154, 0.65));">
            </div>
            <h1 class="text-5xl font-extrabold tracking-wide" style="color:#ffffff; text-shadow: 0 0 15px rgba(126,242,154,0.6), 0 0 30px rgba(126,242,154,0.3), 0 2px 10px rgba(0,0,0,0.5);">
                X-TECH RAMA 2
            </h1>
            <p class="text-sm font-medium tracking-[0.15em] uppercase mt-3" style="color:#7EF29A;">
                 SERVICE SUPPORT ASSISTANT
            </p>
        </header>

        <!-- SEARCH CONTAINER -->
        <div class="glass p-8 shadow-2xl mb-10">
            <div class="flex flex-col md:flex-row gap-4">
                <select id="carModel" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white md:w-1/3 focus:outline-none focus:border-green-400" onchange="checkModelShortcut()">
                    <optgroup label="SUV">
                        <option value="G6">XPENG G6</option>
                    </optgroup>
                    <optgroup label="MPV">
                        <option value="X9">XPENG X9</option>
                        <option value="X9_2026">XPENG X9 2026</option>
                    </optgroup>
                    <optgroup label="Support">
                        <option value="SCREEN">SCREEN</option>
                    </optgroup>
                </select>

                <!-- ส่วนของการค้นหาปกติ -->
                <div id="searchFields" class="flex flex-col md:flex-row gap-4 flex-grow">
                    <input type="text" id="searchInput" placeholder="ค้นหาข้อมูล เช่น Camp Mode, ลมยาง, ชาร์จ..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-6 py-4 text-white focus:outline-none focus:border-green-400">
                    <button onclick="doSearch()" class="btn-green px-10 py-4 rounded-xl">🔍 ค้นหา</button>
                </div>
            </div>
        </div>

        <!-- STATUS -->
        <div id="statusMsg" class="text-center text-slate-500 mb-8">
            ระบบพร้อมค้นหาข้อมูล X-tech
        </div>

        <!-- RESULTS -->
        <div id="resArea" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">ผลการค้นหา</h2>
                <span id="resultCount" class="bg-green-900/40 text-green-400 px-4 py-2 rounded-full text-xs font-semibold"></span>
            </div>
            <div id="resultsList" class="space-y-4"></div>
        </div>

        <!-- REFERRAL -->
        <div class="mt-20 glass p-10 text-center">
            <h2 class="text-3xl font-bold text-white mb-4">🚗 มีเพื่อนสนใจ XPENG?</h2>
            <p class="text-gray-400 max-w-2xl mx-auto mb-8">
                หากมีเพื่อนหรือคนรู้จักสนใจ XPENG ทีม X-tech Rama 2 ยินดีดูแลและให้ข้อมูลเพิ่มเติม
            </p>
            <button onclick="openReferralModal()" class="btn-green px-10 py-4 rounded-xl">📩 แนะนำเพื่อน</button>
        </div>

    </div>

    <!-- MODAL -->
    <div id="referralModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 px-4">
        <div class="glass p-8 w-full max-w-xl relative">
            <button onclick="closeReferralModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
            <h2 class="text-2xl font-bold mb-6 text-white">📩 แนะนำเพื่อน</h2>
            <div class="space-y-4">
                <input id="yourName" type="text" placeholder="ชื่อผู้แนะนำ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400">
                <input id="yourPhone" type="text" placeholder="เบอร์ผู้แนะนำ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400">
                <input id="friendName" type="text" placeholder="ชื่อเพื่อน" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400">
                <input id="friendPhone" type="text" placeholder="เบอร์เพื่อน" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400">
                <select id="interestModel" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400">
                    <option value="G6">XPENG G6</option>
                    <option value="X9">XPENG X9</option>
                </select>
                <textarea id="note" rows="4" placeholder="ข้อความเพิ่มเติม" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-green-400"></textarea>
                <button onclick="submitReferral()" class="btn-green w-full py-4 rounded-xl">🚀 ส่งข้อมูล</button>
            </div>
            <div id="referralStatus" class="text-center text-sm text-gray-400 mt-4"></div>
        </div>
    </div>

    <script>
        const API = "https://xpeng-rama2.onrender.com";

        function checkModelShortcut() {
            const model = document.getElementById("carModel").value;
            const searchFields = document.getElementById("searchFields");
            const status = document.getElementById("statusMsg");
            const list = document.getElementById("resultsList");
            const area = document.getElementById("resArea");
            const count = document.getElementById("resultCount");

            if (model === "SCREEN") {
                searchFields.classList.add("hidden");
                status.innerHTML = "";
                
                area.classList.remove("hidden");
                count.innerHTML = "เมนูด่วน";
                
                list.innerHTML = `
                    <div class="glass p-8 text-center border-2 border-dashed border-green-500/50 bg-green-950/10">
                        <p class="text-lg font-medium text-white mb-4">📺 ทางลัดคู่มือหน้าจอ SCREEN สำหรับทีมเทคนิค</p>
                        <a href="${API}/view/SCREEN" target="_blank" class="btn-green inline-block px-8 py-3 rounded-xl no-underline">
                            📂 เปิดดูคู่มือ SCREEN ฉบับเต็ม
                        </a>
                    </div>
                `;
            } else {
                searchFields.classList.remove("hidden");
                area.classList.add("hidden");
                list.innerHTML = "";
                status.innerHTML = "ระบบพร้อมค้นหาข้อมูล X-tech";
            }
        }

        async function doSearch(){
            const query = document.getElementById("searchInput").value.trim();
            const model = document.getElementById("carModel").value;
            const status = document.getElementById("statusMsg");
            const list = document.getElementById("resultsList");
            const area = document.getElementById("resArea");
            const count = document.getElementById("resultCount");

            if(!query){
                alert("กรุณาพิมพ์คำค้นหา");
                return;
            }

            status.innerHTML = "⏳ กำลังค้นข้อมูล...";
            list.innerHTML = "";
            area.classList.add("hidden");

            try{
                const response = await fetch(`${API}/search`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify({ query, model })
                });

                const data = await response.json();
                status.innerHTML = "";
                area.classList.remove("hidden");
                count.innerHTML = `พบ ${data.length} รายการ`;

                if(data.length === 0){
                    list.innerHTML = `
                    <div class="glass p-10 text-center text-gray-500">
                        ไม่พบข้อมูล
                    </div>`;
                    return;
                }

                data.forEach(item => {
                    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escapQuery, "gi");
                    const highlightedText = item.text.replace(
                        regex,
                        match => `<mark style="background:#facc15; color:#000; padding:2px 4px; border-radius:4px; font-weight:bold;">${match}</mark>`
                    );

                    const card = document.createElement("div");
                    card.className = "glass p-6";
                    card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <span class="bg-green-900/40 text-green-400 px-3 py-1 rounded text-xs font-semibold">หน้า ${item.page}</span>
                            <span class="ml-2 text-xs text-gray-500">${item.model}</span>
                        </div>
                        <a href="${API}/view/${item.model}#page=${item.page}" target="_blank" class="text-green-400 hover:text-green-300 text-sm font-medium transition">📄 เปิด PDF</a>
                    </div>
                    <div class="text-slate-300 leading-relaxed whitespace-pre-line">${highlightedText}</div>`;
                    
                    list.appendChild(card);
                });

            }catch(error){
                console.log(error);
                status.innerHTML = "❌ ไม่สามารถเชื่อมต่อระบบได้";
            }
        }

        function openReferralModal(){
            const modal = document.getElementById("referralModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeReferralModal(){
            const modal = document.getElementById("referralModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        async function submitReferral(){
            const status = document.getElementById("referralStatus");
            const data = {
                your_name: document.getElementById("yourName").value,
                your_phone: document.getElementById("yourPhone").value,
                friend_name: document.getElementById("friendName").value,
                friend_phone: document.getElementById("friendPhone").value,
                model: document.getElementById("interestModel").value,
                note: document.getElementById("note").value
            };

            status.innerHTML = "⏳ กำลังส่งข้อมูล...";

            try{
                const response = await fetch(`${API}/referral`, {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body:JSON.stringify(data)
                });

                const result = await response.json();
                if(result.success){
                    status.innerHTML = "✅ ส่งข้อมูลเรียบร้อย";
                }else{
                    status.innerHTML = "❌ เกิดข้อผิดพลาด";
                }
            }catch(error){
                console.log(error);
                status.innerHTML = "❌ เชื่อมต่อระบบไม่ได้";
            }
        }

        document.getElementById("searchInput").addEventListener("keypress",(e)=>{
            if(e.key === "Enter"){
                doSearch();
            }
        });
    </script>
</body>
</html>
