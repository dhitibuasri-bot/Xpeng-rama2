<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>XPENG RAMA 2 Service Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
    <style>body{background:#0B0F19; color:#E2E8F0; font-family:'Prompt';} .glass{background:rgba(26,32,44,0.75); border:1px solid #2D3748; border-radius:24px;}</style>
</head>
<body class="py-12 px-6">
    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-white">XPENG RAMA 2</h1>
            <p class="text-[#7EF29A]">SERVICE SUPPORT ASSISTANT</p>
        </header>

        <div class="glass p-8 mb-10">
            <div class="flex flex-col md:flex-row gap-4">
                <select id="carModel" onchange="toggleView()" class="bg-slate-900 border border-slate-700 rounded-xl p-4 text-white">
                    <option value="G6">XPENG G6</option>
                    <option value="X9_2026">XPENG X9 2026</option>
                    <option value="FREQUENT">🛠️ การตั้งค่าที่ใช้บ่อย</option>
                </select>
                
                <div id="searchArea" class="flex flex-grow gap-4">
                    <input type="text" id="searchInput" class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-6 py-4" placeholder="ค้นหาคู่มือ...">
                    <button onclick="doSearch()" class="bg-white text-black px-10 rounded-xl font-bold">🔍 ค้นหา</button>
                </div>
            </div>
        </div>

        <div id="resultsList" class="space-y-4"></div>
    </div>

    <script>
        const API = "https://xpeng-rama2.onrender.com";
        
        function toggleView() {
            const isFreq = document.getElementById("carModel").value === "FREQUENT";
            document.getElementById("searchArea").classList.toggle("hidden", isFreq);
            if(isFreq) window.open(`${API}/view/FREQUENT`, '_blank');
        }

        async function doSearch() {
            const query = document.getElementById("searchInput").value;
            const model = document.getElementById("carModel").value;
            const res = await fetch(`${API}/search`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({query, model})
            });
            const data = await res.json();
            const list = document.getElementById("resultsList");
            list.innerHTML = data.map(item => `
                <div class="glass p-5">
                    <div class="text-green-400 font-bold">หน้า ${item.page}</div>
                    <div class="text-sm mt-2">${item.text}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
